<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgNavy" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#172C4F"/>
      <stop offset="50%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#0B162B"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="2" y1="2" x2="62" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#436491" stop-opacity="0.72"/>
      <stop offset="50%" stop-color="#274166" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#1B304F" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="glassRimOuter" x1="2" y1="2" x2="62" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.68"/>
      <stop offset="50%" stop-color="#93C5FD" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="glassRimInner" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="dropFill" x1="32" y1="10" x2="32" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="45%" stop-color="#58C7FF"/>
      <stop offset="100%" stop-color="#22A8F0"/>
    </linearGradient>
    <linearGradient id="boltFill" x1="25" y1="12" x2="39" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Liquid Glass Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgNavy)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#glassFill)" stroke="url(#glassRimOuter)" stroke-width="2"/>
  <rect x="4.2" y="4.2" width="55.6" height="55.6" rx="14" fill="none" stroke="url(#glassRimInner)" stroke-width="1"/>

  <!-- Cyan Water Droplet -->
  <path d="M32 10.5C32 10.5 16 28.5 16 39.5C16 48.3366 23.1634 55.5 32 55.5C40.8366 55.5 48 48.3366 48 39.5C48 28.5 32 10.5 32 10.5Z" fill="url(#dropFill)"/>

  <!-- Droplet Left Specular Crescent -->
  <path d="M24.2 39C24.2 34.5 27 28 29 24C25.2 30 22.8 35 22.8 39.5C22.8 44.5 26.2 48.5 31 49.5C27.2 48 24.2 44 24.2 39Z" fill="#FFFFFF" fill-opacity="0.65"/>

  <!-- Lightning Bolt Striking Through the Droplet -->
  <path d="M36.8 12.5L22.5 34H31.8L26.5 53.2L42 30.5H32.5L36.8 12.5Z" fill="url(#boltFill)" stroke="#132542" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M36.8 12.5L22.5 34H31.8L26.5 53.2L42 30.5H32.5L36.8 12.5Z" fill="url(#boltFill)"/>
</svg>
