<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Option 3D: Smoked Silver & Obsidian Full-Bleed Squircle Background -->
    <linearGradient id="bgObsidian" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16243D"/>
      <stop offset="100%" stop-color="#070C17"/>
    </linearGradient>
    <linearGradient id="dropSilver" x1="18" y1="10" x2="46" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#CBD5E1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="waveSilver" x1="16" y1="35" x2="48" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="boltGold" x1="39" y1="13" x2="25" y2="51" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#FEF9C3"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <clipPath id="dropClip">
      <path d="M32 9.5C32 9.5 16 27.2 16 38.8C16 47.6366 23.1634 54.8 32 54.8C40.8366 54.8 48 47.6366 48 38.8C48 27.2 32 9.5 32 9.5Z"/>
    </clipPath>
  </defs>

  <!-- Full-Bleed Borderless Background -->
  <rect width="64" height="64" fill="url(#bgObsidian)"/>

  <!-- Smoked Silver Glass Droplet -->
  <path d="M32 9.5C32 9.5 16 27.2 16 38.8C16 47.6366 23.1634 54.8 32 54.8C40.8366 54.8 48 47.6366 48 38.8C48 27.2 32 9.5 32 9.5Z" fill="url(#dropSilver)"/>

  <!-- Mirrored Lightning Bolt (Tucked Behind Translucent Wave) -->
  <path d="M28.6 14.5C28.3 13.8 27.4 14.2 27.6 14.9L31.5 29.2H24.6C23.9 29.2 23.5 30 23.9 30.6L35.4 50C35.8 50.6 36.7 50.2 36.5 49.5L32.5 34.8H39.4C40.1 34.8 40.5 34 40.1 33.4L28.6 14.5Z" fill="url(#boltGold)"/>

  <!-- Translucent Smoked-Silver Wave Refracting Over Lower Bolt Tip -->
  <g clip-path="url(#dropClip)">
    <path d="M14 40C21.5 34 29 44 37.5 38C42.5 34.5 46 33 50 35.5V56H14V40Z" fill="url(#waveSilver)"/>
    <path d="M15 40C22 34.2 29 43.8 37.5 37.8C42.5 34.2 46 33 49.5 35.2" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="1.15"/>
  </g>

  <!-- Crisp Specular Droplet Rim -->
  <path d="M32 9.5C32 9.5 16 27.2 16 38.8C16 47.6366 23.1634 54.8 32 54.8C40.8366 54.8 48 47.6366 48 38.8C48 27.2 32 9.5 32 9.5Z" stroke="#FFFFFF" stroke-opacity="0.58" stroke-width="1.1"/>
</svg>
