<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070e20" />
  <title>Returning to ZüsCast…</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #070e20;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 20px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.01em;
    }
    p {
      font-size: 14px;
      color: rgba(226, 232, 240, 0.75);
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #38bdf8;
      color: #070e20;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 9999px;
      transition: opacity 0.15s ease;
    }
    .btn:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Returning to ZüsCast…</h1>
    <p>Completing your sign-in. If the app does not open automatically, tap the button below.</p>
    <a id="return-link" class="btn" href="#">Open ZüsCast</a>
  </div>

  <script>
    (function () {
      var search = window.location.search || "";
      var hash = window.location.hash || "";
      var deepLink = "zuscast://auth/callback" + search + hash;
      var returnLink = document.getElementById("return-link");
      if (returnLink) {
        returnLink.href = deepLink;
      }
      try {
        window.location.replace(deepLink);
      } catch (err) {
        // Fallback to manual click if replace is blocked
      }
    })();
  </script>
</body>
</html>
